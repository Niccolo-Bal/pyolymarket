[build-system]
requires = ["setuptools>=48", "setuptools_scm[toml]>=6.3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pyolymarket"
description = "Python wrapper for the Polymarket Gamma and CLOB APIs, with native and embedding-based event search"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "requests",
    "urllib3",
]

[project.optional-dependencies]
# The Gamma and CLOB clients need nothing beyond the core. Everything below is
# resolved lazily on first use, so a missing extra raises a message naming it
# rather than failing at import.
cache = [
  "numpy",
  "pandas",
  "pyarrow",
  "alive-progress",
]

embeddings = [
  "numpy",
  "openai",
]

search = [
  "ddgs",
]

trading = [
  "eth-account",
]

all = [
  "pyolymarket[cache,embeddings,search,trading]",
]

docs = [
  "mkdocs",
  "mkdocstrings-python",
]

tests = [
  "pytest>=8,<9",
  "pytest-sugar>=0.9.6",
]

[project.urls]
Documentation = "https://github.com/Niccolo-Bal/pyolymarket"
Issues = "https://github.com/Niccolo-Bal/pyolymarket"
Source = "https://github.com/Niccolo-Bal/pyolymarket"

[tool.setuptools.packages.find]
include = ["pyolymarket", "pyolymarket.*"]
where = ["src"]
namespaces = false

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

