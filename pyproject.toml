[build-system]
requires = ["setuptools>=77", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pyolymarket"
description = "Python wrapper for the Polymarket Gamma and CLOB APIs, with native and embedding-based event search"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{name = "Niccolo-Bal"}]
requires-python = ">=3.10"
keywords = ["polymarket", "prediction markets", "gamma", "clob", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
# The version comes from the git tag (see [tool.setuptools_scm]). A build made
# on the commit tagged v0.2.0 is 0.2.0; a build made anywhere else is a .dev
# version, which pip skips by default. Only publish builds of tagged commits.
dynamic = ["version"]
dependencies = [
    "requests",
    "urllib3",
]

[project.optional-dependencies]

cache = [
  "numpy",
  "pandas",
  "pyarrow",
  "alive-progress",
  "openai",
]

embeddings = [
  "numpy",
  "openai",
]

search = [
  "ddgs",
]

trading = [
  "eth-account",
]

all = [
  "pyolymarket[cache,embeddings,search,trading]",
]

docs = [
  "mkdocs",
  "mkdocstrings-python",
]

tests = [
  "pytest>=8",
  "pytest-sugar>=0.9.6",
]

[project.urls]
Homepage = "https://github.com/Niccolo-Bal/pyolymarket"
Source = "https://github.com/Niccolo-Bal/pyolymarket"
Issues = "https://github.com/Niccolo-Bal/pyolymarket/issues"

[tool.setuptools.packages.find]
include = ["pyolymarket", "pyolymarket.*"]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

